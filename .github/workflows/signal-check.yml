name: crypto-quant-signal-monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # 每15分钟检查一次
  workflow_dispatch:          # 支持手动触发
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'check'
        type: choice
        options:
          - check
          - test-mail

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q requests numpy
      - name: Run signal check (EXP3 + EXP4-S @ 4h)
        run: python cloud_signal_checker.py
        env:
          CHECKER_MODE: ${{ inputs.mode }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WATCH_SYMBOLS: ${{ vars.WATCH_SYMBOLS }}
      - name: Commit notified state
        run: |
          git config user.name "crypto-quant-bot"
          git config user.email "crypto-quant-bot@users.noreply.github.com"
          git add state/notified.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update notified signal state [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
